services:
  web:
    build: {context: ., target: web}
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped
  api:
    build: {context: ., target: api}
    environment:
      DATABASE_URL: postgres://aether:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/aether
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aether
    volumes: ["world-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  world-data:
